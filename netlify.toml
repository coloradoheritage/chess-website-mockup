[build]
  publish = "."
  # Only deploy to Netlify when commit subject contains [deploy].
  # All other commits (CMS edits, content changes) go to GitHub Pages only.
  ignore = "git log -1 --pretty=%s | grep -qv '\\[deploy\\]'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
