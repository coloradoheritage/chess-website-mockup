backend:
  name: git-gateway
  branch: main

# Where uploaded images are stored in the repo
media_folder: "images/uploads"
# The public URL path to those images
public_folder: "/images/uploads"

collections:

  # ─────────────────────────────────────────
  # ANNOUNCEMENT BAR
  # ─────────────────────────────────────────
  - name: "site_settings"
    label: "📢 Announcements"
    files:
      - label: "Announcement Bar"
        name: "announcement"
        file: "data/announcement.json"
        format: json
        fields:
          - label: "Show Announcement"
            name: "active"
            widget: "boolean"
            default: true
            hint: "Turn this off to hide the blue bar at the top of every page."
          - label: "Announcement Text"
            name: "text"
            widget: "string"
            hint: "The message displayed in the announcement bar."
          - label: "Button Label"
            name: "link_text"
            widget: "string"
            hint: "The clickable link label (e.g. 'View Classes')."
          - label: "Button URL"
            name: "link_url"
            widget: "string"
            hint: "Where the button links to (e.g. programs.html#academy)."

  # ─────────────────────────────────────────
  # BLOG POSTS
  # ─────────────────────────────────────────
  - name: "posts"
    label: "📝 Blog Posts"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Author", name: "author", widget: "string", default: "Colorado Heritage" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Announcements"
          - "Education"
          - "Faith & Learning"
          - "News"
          - "Resources"
          - "Events"
      - { label: "Short Excerpt", name: "excerpt", widget: "text", hint: "1–2 sentences shown on the blog listing page." }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # ─────────────────────────────────────────
  # PEOPLE — Faculty, Staff, Board
  # ─────────────────────────────────────────
  - name: "people"
    label: "👥 People"
    files:

      - label: "Faculty"
        name: "faculty"
        file: "data/faculty.json"
        format: json
        fields:
          - label: "Faculty Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Subject(s)", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a headshot or paste a URL." }
              - { label: "Bio", name: "bio", widget: "text", hint: "Short paragraph displayed on the Faculty & Staff page." }

      - label: "Office Staff"
        name: "staff"
        file: "data/staff.json"
        format: json
        fields:
          - label: "Staff Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text" }

      - label: "Board of Directors"
        name: "board"
        file: "data/board.json"
        format: json
        fields:
          - label: "Board Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text", required: false }

  # ─────────────────────────────────────────
  # TESTIMONIALS
  # ─────────────────────────────────────────
  - name: "testimonials"
    label: "💬 Testimonials"
    files:
      - label: "Family Testimonials"
        name: "testimonials"
        file: "data/testimonials.json"
        format: json
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "Family Name", name: "name", widget: "string", hint: "e.g. Polly or The Smith Family" }
              - { label: "City, State", name: "location", widget: "string", hint: "e.g. Greeley, CO" }
              - { label: "Quote", name: "quote", widget: "text" }
