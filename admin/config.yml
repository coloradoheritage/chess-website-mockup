backend:
  name: git-gateway
  branch: main

# Images stored in repo. Relative path (no leading slash) works on both the
# GitHub Pages preview URL and the future custom domain without changes.
media_folder: "images/uploads"
public_folder: "images/uploads"

collections:

  # ─────────────────────────────────────────
  # ANNOUNCEMENT BAR
  # ─────────────────────────────────────────
  - name: "site_settings"
    label: "📢 Announcements"
    editor:
      preview: false
    files:
      - label: "Announcement Bar"
        name: "announcement"
        file: "data/announcement.json"
        format: json
        fields:
          - label: "Show Announcement"
            name: "active"
            widget: "boolean"
            default: true
            hint: "Turn this off to hide the blue bar at the top of every page."
          - label: "Announcement Text"
            name: "text"
            widget: "string"
            hint: "The message displayed in the announcement bar."
          - label: "Button Label"
            name: "link_text"
            widget: "string"
            hint: "The clickable link label (e.g. 'View Classes')."
          - label: "Button URL"
            name: "link_url"
            widget: "string"
            hint: "Where the button links to (e.g. programs.html#academy)."

  # ─────────────────────────────────────────
  # BLOG POSTS  (edits data/posts.json — the file the website actually reads)
  # ─────────────────────────────────────────
  - name: "blog"
    label: "📝 Blog Posts"
    editor:
      preview: false
    files:
      - label: "Blog Posts"
        name: "posts"
        file: "data/posts.json"
        format: json
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "Lowercase with dashes — e.g. why-christian-education. Becomes the article's web address." }
              - { label: "Date", name: "date", widget: "string", hint: "e.g. June 1, 2026" }
              - { label: "Summary", name: "summary", widget: "text", hint: "1–2 sentences shown on the blog listing page." }
              - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Optional. Shows at the top of the article and on the blog list." }
              - { label: "Body", name: "body", widget: "markdown", hint: "The full article. Use headings, bold, lists, quotes." }

  # ─────────────────────────────────────────
  # CLASS SCHEDULE
  # ─────────────────────────────────────────
  - name: "schedule"
    label: "📅 Class Schedule"
    editor:
      preview: false
    files:
      - label: "Class Schedule"
        name: "schedule"
        file: "data/schedule.json"
        format: json
        fields:
          - { label: "Semester Label", name: "semester", widget: "string", hint: "e.g. 2027/2028 — Two 14-Week Semesters" }
          - { label: "Note", name: "note", widget: "string" }
          - label: "Classes"
            name: "classes"
            widget: "list"
            summary: "{{fields.day}} {{fields.time}} — {{fields.name}} (Grades {{fields.grade_band}})"
            fields:
              - label: "Grade Band"
                name: "grade_band"
                widget: "select"
                options: ["K-2", "3-5", "6-8", "9-12"]
              - label: "Day"
                name: "day"
                widget: "select"
                options: ["Tuesday", "Thursday"]
              - { label: "Time", name: "time", widget: "string", hint: "e.g. 8:15" }
              - { label: "Class Name", name: "name", widget: "string" }
              - { label: "Instructor", name: "instructor", widget: "string" }
              - { label: "Room Code", name: "room", widget: "string", hint: "e.g. cs, au, rh, pa, bs" }

  # ─────────────────────────────────────────
  # TUITION & FEES
  # ─────────────────────────────────────────
  - name: "tuition"
    label: "💰 Tuition & Fees"
    editor:
      preview: false
    files:
      - label: "Fee Schedule"
        name: "tuition"
        file: "data/tuition.json"
        format: json
        fields:
          - { label: "Disclaimer Note", name: "note", widget: "text", hint: "Shown at the top of the fee schedule page." }
          - label: "Programs"
            name: "programs"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Program Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Fees"
                name: "fees"
                widget: "list"
                summary: "{{fields.item}} — {{fields.amount}}"
                fields:
                  - { label: "Line Item", name: "item", widget: "string" }
                  - { label: "Amount", name: "amount", widget: "string", hint: "e.g. $125.00" }
                  - { label: "Notes", name: "notes", widget: "string", required: false, hint: "e.g. Non-refundable, due at enrollment" }

  # ─────────────────────────────────────────
  # PEOPLE — Faculty, Staff, Board
  # ─────────────────────────────────────────
  - name: "people"
    label: "👥 People"
    editor:
      preview: false
    files:

      - label: "Faculty"
        name: "faculty"
        file: "data/faculty.json"
        format: json
        fields:
          - label: "Faculty Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Subject(s)", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a headshot." }
              - { label: "Bio", name: "bio", widget: "text" }

      - label: "Office Staff"
        name: "staff"
        file: "data/staff.json"
        format: json
        fields:
          - label: "Staff Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text" }

      - label: "Board of Directors"
        name: "board"
        file: "data/board.json"
        format: json
        fields:
          - label: "Board Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text", required: false }

  # ─────────────────────────────────────────
  # TESTIMONIALS
  # ─────────────────────────────────────────
  - name: "testimonials"
    label: "💬 Testimonials"
    editor:
      preview: false
    files:
      - label: "Family Testimonials"
        name: "testimonials"
        file: "data/testimonials.json"
        format: json
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "Family Name", name: "name", widget: "string" }
              - { label: "City, State", name: "location", widget: "string" }
              - { label: "Quote", name: "quote", widget: "text" }
